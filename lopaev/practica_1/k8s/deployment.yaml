apiVersion: apps/v1        # Версия API для работы с Deployments
kind: Deployment           # Тип ресурса Kubernetes - Deployment
metadata:
  name: first_task2342          # Имя деплоймента в кластере
  labels:
    app: first_task2342         # Метка для идентификации ресурса
spec:
  replicas: 2              # Количество реплик (pod'ов) для запуска
  selector:
    matchLabels:
      app: first_task2342       # Селектор для управления pod'ами с этой меткой
  template:                # Шаблон для создания pod'ов
    metadata:
      labels:
        app: first_task2342     # Метка, которая будет у создаваемых pod'ов
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: first_task2342    # Имя контейнера внутри pod'а
        image: "{{test_for_first_task2342:latest}}"  # Используемый Docker образ
        ports:
        - containerPort: 5000  # Порт, который открывает контейнер
        env:                   # Переменные окружения
        - name: FLASK_ENV      # Установка окружения Flask в production
          value: "production"
        resources:             # (Опционально) Лимиты ресурсов
          requests:
            cpu: "10m"       # Запрашиваем 0.01 CPU
            memory: "128Mi"   # Запрашиваем 128 MiB памяти
          limits:
            cpu: "50m"       # Лимит 0.05 CPU
            memory: "512Mi"   # Лимит 512 MiB памяти
        livenessProbe:
          httpGet:
            path: /healthz  # или правильный путь для вашего приложения
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz   # или правильный путь для вашего приложения
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10

